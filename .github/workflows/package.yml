name: Build and Release Packages

# Tags build and publish a release. Starting this by hand only builds the packages, or, given the
# version to come, publishes them as a beta of it: the Beta pre-release, which replaces the one
# before and leaves the latest release alone.
on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:
    inputs:
      beta:
        description: Publish a beta of this version, like 6.10.0
        type: string
        default: ''

jobs:
  # Betas of a version count up from 1, after the one published last, and a new version starts
  # again. It has to come after the latest release, so the beta installs over it.
  beta:
    name: Number the beta
    if: inputs.beta != ''
    runs-on: ubuntu-latest
    outputs:
      number: ${{ steps.count.outputs.number }}
    steps:
      - id: count
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.beta }}
        run: |
          if ! echo "$VERSION" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::A beta's version is three numbers, like 6.10.0."
            exit 1
          fi
          latest=$(gh release view -R "$GITHUB_REPOSITORY" --json tagName -q .tagName)
          latest=${latest#v}
          if [ "$VERSION" = "$latest" ] ||
            [ "$(printf '%s\n%s\n' "$latest" "$VERSION" | sort -V | tail -n 1)" != "$VERSION" ]; then
            echo "::error::A beta has to be of a version after $latest."
            exit 1
          fi
          name=$(gh release view beta -R "$GITHUB_REPOSITORY" --json name -q .name 2>/dev/null || true)
          case "$name" in
            "Gestos $VERSION beta "*) number=$((${name##* } + 1)) ;;
            *) number=1 ;;
          esac
          echo "number=$number" >> "$GITHUB_OUTPUT"

  build-fedora:
    name: Build Fedora RPM (${{ matrix.arch }})
    needs: beta
    # Also when there's no beta to number.
    if: ${{ !failure() && !cancelled() }}
    strategy:
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-latest
          # Apple silicon Macs run this one, in a VM or on Asahi Linux.
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    container: fedora:latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Number as a beta
        if: inputs.beta != ''
        env:
          VERSION: ${{ inputs.beta }}
          NUMBER: ${{ needs.beta.outputs.number }}
        run: sh packaging/mark-beta.sh "$VERSION" "$NUMBER"

      - name: Cache Cargo dependencies
        uses: actions/cache@v4
        with:
          path: |
            .cargo
            target-fedora
          key: ${{ runner.os }}-fedora-${{ matrix.arch }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-fedora-${{ matrix.arch }}-cargo-

      - name: Install dependencies
        run: |
          dnf install -y meson ninja-build cargo rust gtk4-devel libadwaita-devel libevdev-devel gcc systemd-rpm-macros rpm-build rpmdevtools git

      - name: Build RPM
        run: |
          export CARGO_HOME=$GITHUB_WORKSPACE/.cargo
          export OVERRIDE_CARGO_TARGET_DIR=$GITHUB_WORKSPACE/target-fedora
          rpmdev-setuptree
          VERSION=$(grep '^Version:' packaging/gestos.spec | awk '{print $2}')
          tar --exclude-vcs --exclude='.cargo' --exclude='target-fedora' --transform "s,^\.,gestos-$VERSION," -czf ~/rpmbuild/SOURCES/gestos-$VERSION.tar.gz .
          rpmbuild -ba packaging/gestos.spec

      - name: Upload RPM Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: fedora-rpm-${{ matrix.arch }}
          path: /github/home/rpmbuild/RPMS/*/*.rpm

      # The source package is the same for both, and would clash in the release.
      - name: Upload Source RPM
        if: matrix.arch == 'x86_64'
        uses: actions/upload-artifact@v4
        with:
          name: fedora-srpm
          path: /github/home/rpmbuild/SRPMS/*.rpm

  build-debian:
    name: Build Debian DEB
    needs: beta
    # Also when there's no beta to number.
    if: ${{ !failure() && !cancelled() }}
    runs-on: ubuntu-latest
    container: debian:bookworm
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Number as a beta
        if: inputs.beta != ''
        env:
          VERSION: ${{ inputs.beta }}
          NUMBER: ${{ needs.beta.outputs.number }}
        run: sh packaging/mark-beta.sh "$VERSION" "$NUMBER"

      - name: Cache Cargo dependencies
        uses: actions/cache@v4
        with:
          path: |
            .cargo
            target
          key: ${{ runner.os }}-debian-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-debian-cargo-

      - name: Install dependencies
        run: |
          apt-get update
          apt-get install -y build-essential devscripts debhelper libevdev-dev libgtk-4-dev libadwaita-1-dev libc6-dev pkg-config git curl
          
          # Set CARGO_HOME to a workspace-relative directory so it can be cached
          export CARGO_HOME=$GITHUB_WORKSPACE/.cargo
          
          # Install rustup only if not already cached
          if [ ! -f "$CARGO_HOME/bin/cargo" ]; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
          fi
          echo "$CARGO_HOME/bin" >> $GITHUB_PATH

      - name: Build Debian Package
        run: |
          export CARGO_HOME=$GITHUB_WORKSPACE/.cargo
          dpkg-buildpackage -us -uc -b -d
          mv ../*.deb .

      - name: Upload Debian Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: debian-deb
          path: "*.deb"

  build-alpine:
    name: Build Alpine APK (${{ matrix.arch }})
    needs: beta
    # Also when there's no beta to number.
    if: ${{ !failure() && !cancelled() }}
    strategy:
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-latest
          # Apple silicon Macs run this one, in a VM or on Asahi Linux.
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Number as a beta
        if: inputs.beta != ''
        env:
          VERSION: ${{ inputs.beta }}
          NUMBER: ${{ needs.beta.outputs.number }}
        run: sh packaging/mark-beta.sh "$VERSION" "$NUMBER"

      - name: Cache Cargo dependencies
        uses: actions/cache@v4
        with:
          path: |
            .cargo
            target-alpine
          key: ${{ runner.os }}-alpine-${{ matrix.arch }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-alpine-${{ matrix.arch }}-cargo-

      # JavaScript actions don't run in Alpine containers on ARM, so only the build runs in one.
      - name: Build Alpine Package
        run: |
          docker run --rm -v "$PWD:/src" -w /src alpine:latest sh packaging/build-apk.sh
          # Give the checkout back to the runner, which cleans up its git settings afterwards.
          sudo chown -R "$(id -u):$(id -g)" .

      - name: Upload Alpine Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: alpine-apk-${{ matrix.arch }}
          path: apk/*.apk

  release:
    name: Publish Github Release
    needs: [beta, build-fedora, build-debian, build-alpine]
    runs-on: ubuntu-latest
    if: ${{ !failure() && !cancelled() && (startsWith(github.ref, 'refs/tags/v') || inputs.beta != '') }}
    permissions:
      contents: write
    steps:
      # For the release notes, and the script that adds which package to install. A beta lists
      # what changed since the last release, which takes the history.
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          path: source
          fetch-depth: 0

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: packages
          merge-multiple: true

      # Debugging symbols stay with the run's artifacts, apart from what users download.
      - name: Leave out debug packages
        run: find packages \( -name '*-dbgsym_*' -o -name '*-debuginfo-*' -o -name '*-debugsource-*' \) -delete

      - name: Write the release page
        env:
          VERSION: ${{ inputs.beta }}
        run: |
          if [ -n "$VERSION" ]; then
            last=$(git -C source describe --tags --abbrev=0 --match 'v*')
            {
              echo "A preview of Gestos $VERSION, built from $(git -C source rev-parse --short HEAD)."
              echo
              echo "## Changes since ${last#v}"
              echo
              git -C source log --no-merges --format='- %s' "$last..HEAD" |
                grep -v -E '^- (Bump version|Write the release notes)' || true
            } > notes.md
          else
            cp source/RELEASE_NOTES.md notes.md
          fi
          sh source/packaging/release-body.sh notes.md packages > release-body.md

      # Only one beta is kept, so its page always has the newest.
      - name: Remove the previous beta
        if: inputs.beta != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release delete beta --cleanup-tag --yes -R "$GITHUB_REPOSITORY" || true

      - name: Publish Release with Assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.beta != '' && 'beta' || github.ref_name }}
          name: ${{ inputs.beta != '' && format('Gestos {0} beta {1}', inputs.beta, needs.beta.outputs.number) || github.ref_name }}
          target_commitish: ${{ github.sha }}
          prerelease: ${{ inputs.beta != '' }}
          make_latest: ${{ inputs.beta != '' && 'false' || 'true' }}
          body_path: release-body.md
          files: |
            packages/**/*.rpm
            packages/**/*.deb
            packages/**/*.apk
