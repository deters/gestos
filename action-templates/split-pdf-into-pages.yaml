gestos-action-template: 1
id: split-pdf-into-pages
name: Split PDF into Pages
description: Saves each page of the selected PDFs as a PDF of its own, in a folder next to it
icon: view-paged-symbolic
apps: [FileManager]
needs:
  - program: pdfseparate
    package: poppler-utils
steps:
  - copy: files
  - run: |
      #!/bin/sh
      fail() { printf '%s\n' "$*" >&2; exit 1; }
      show() { printf '%s\n' "$*"; }

      for input_pdf in "$@"; do
          name=$(basename "$input_pdf")
          case $name in *.pdf|*.PDF) ;; *) fail "$name isn't a PDF" ;; esac
      done

      for input_pdf in "$@"; do
          folder=$(dirname "$input_pdf")
          name=$(basename "$input_pdf")
          without_extension="${name%.*}"
          output_folder_name="$without_extension (pages)"
          output_folder="$folder/$output_folder_name"
          [ -e "$output_folder" ] && fail "$output_folder_name is there already"
          mkdir "$output_folder" || fail "Couldn't make $output_folder_name"
          # pdfseparate puts the page number where %d is, and reads %% as a %.
          pages_start=$(printf '%s\n' "$output_folder/$without_extension" | sed 's/%/%%/g')
          pdfseparate "$input_pdf" "$pages_start page %d.pdf" || fail "Couldn't split $name"
      done

      if [ $# -eq 1 ]; then
          pages=$(ls "$output_folder" | wc -l)
          show "Saved $pages pages in $output_folder_name"
      else
          show "Split $# PDFs"
      fi
  - show: 3
