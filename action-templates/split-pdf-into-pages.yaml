gestos-action-template: 1
name: Split PDF into Pages
description: Saves each page of the selected PDFs as a PDF of its own, in a folder next to it
icon: view-paged-symbolic
apps: [FileManager]
needs:
  - program: pdfseparate
    package: poppler-utils
steps:
  - copy: files
  - run: |
      fail() { echo "$*" >&2; exit 1; }
      show() { echo "$*"; }

      for f in "$@"; do
          case $f in *.pdf|*.PDF) ;; *) fail "$(basename "$f") isn't a PDF" ;; esac
      done

      for f in "$@"; do
          folder="${f%.*} (pages)"
          [ -e "$folder" ] && fail "$(basename "$folder") is there already"
          mkdir "$folder" || fail "Couldn't make $(basename "$folder")"
          name=$(basename "$f")
          pdfseparate "$f" "$folder/${name%.*} page %d.pdf" || fail "Couldn't split $(basename "$f")"
      done

      [ $# -eq 1 ] && show "Saved $(ls "$folder" | wc -l) pages in $(basename "$folder")" || show "Split $# PDFs"
