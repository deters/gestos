gestos-action-template: 1
name: Translate
description: Opens the selected text in Google Translate
icon: preferences-desktop-locale-symbolic
needs:
  - program: python3
    package: Python
steps:
  - copy: text
  - run: |
      fail() { echo "$*" >&2; exit 1; }
      show() { echo "$*"; }

      [ -n "$GESTOS_CLIPBOARD" ] || fail "Select some text first"

      text=$(python3 -c 'import sys, urllib.parse; print(urllib.parse.quote(sys.argv[1]))' "$GESTOS_CLIPBOARD")
      xdg-open "https://translate.google.com/?op=translate&sl=auto&text=$text"
