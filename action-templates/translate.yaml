gestos-action-template: 1
id: translate
name: Translate
description: Opens the selected text in Google Translate
icon: preferences-desktop-locale-symbolic
needs:
  - program: python3
    package: Python
steps:
  - copy: text
  - run: |
      #!/bin/sh
      fail() { printf '%s\n' "$*" >&2; exit 1; }
      show() { printf '%s\n' "$*"; }

      input_text="$GESTOS_CLIPBOARD"
      [ -n "$input_text" ] || fail "Select some text first"

      # The text as a web address has it: a & b? → a%20%26%20b%3F
      encoded_text=$(python3 -c 'import sys, urllib.parse; print(urllib.parse.quote(sys.argv[1]))' "$input_text")
      output_address="https://translate.google.com/?op=translate&sl=auto&text=$encoded_text"
      xdg-open "$output_address"
