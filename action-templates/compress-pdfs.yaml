gestos-action-template: 1
name: Compress PDFs
description: Saves a smaller copy of each selected PDF, next to it, for sending by email
icon: zoom-out-symbolic
apps: [FileManager]
needs:
  - program: gs
    package: Ghostscript
steps:
  - copy: files
  - run: |
      fail() { echo "$*" >&2; exit 1; }
      show() { echo "$*"; }
      size() { wc -c < "$1" | awk '{ printf ($1 >= 1048576 ? "%.1f MB" : "%d KB"), ($1 >= 1048576 ? $1 / 1048576 : $1 / 1024) }'; }

      for f in "$@"; do
          case $f in *.pdf|*.PDF) ;; *) fail "${f##*/} isn't a PDF" ;; esac
      done

      made=0
      for f in "$@"; do
          small="${f%.*} (compressed).pdf"
          [ -e "$small" ] && continue
          gs -q -dNOPAUSE -dBATCH -dSAFER -sDEVICE=pdfwrite -dPDFSETTINGS=/ebook \
              -sOutputFile="$small" "$f" || { rm -f "$small"; fail "Couldn't compress ${f##*/}"; }
          if [ "$(wc -c < "$small")" -ge "$(wc -c < "$f")" ]; then
              rm -f "$small"
              continue
          fi
          made=$((made + 1))
          last="${f##*/}: $(size "$f") → $(size "$small")"
      done

      [ "$made" -gt 0 ] || fail "The selected PDFs can't be made smaller"
      [ "$made" -eq 1 ] && show "$last" || show "Compressed $made PDFs"
