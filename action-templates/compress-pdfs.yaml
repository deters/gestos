gestos-action-template: 1
id: compress-pdfs
name: Compress PDFs
description: Saves a smaller copy of each selected PDF, next to it, for sending by email
icon: zoom-out-symbolic
apps: [FileManager]
needs:
  - program: gs
    package: Ghostscript
steps:
  - copy: files
  - run: |
      #!/bin/sh
      fail() { printf '%s\n' "$*" >&2; exit 1; }
      show() { printf '%s\n' "$*"; }
      # 52000 → 50 KB, 2097152 → 2.0 MB
      readable_size() { awk -v bytes="$1" 'BEGIN { if (bytes >= 1048576) printf "%.1f MB", bytes / 1048576; else printf "%d KB", bytes / 1024 }'; }

      for input_pdf in "$@"; do
          name=$(basename "$input_pdf")
          case $name in *.pdf|*.PDF) ;; *) fail "$name isn't a PDF" ;; esac
      done

      compressed=0
      for input_pdf in "$@"; do
          folder=$(dirname "$input_pdf")
          name=$(basename "$input_pdf")
          without_extension="${name%.*}"
          output_pdf="$folder/$without_extension (compressed).pdf"
          [ -e "$output_pdf" ] && continue

          # Ghostscript reads a % in the name it saves to as a page number, and %% as a %.
          output_for_ghostscript=$(printf '%s\n' "$output_pdf" | sed 's/%/%%/g')
          gs -q -dNOPAUSE -dBATCH -dSAFER -sDEVICE=pdfwrite -dPDFSETTINGS=/ebook \
              -sOutputFile="$output_for_ghostscript" "$input_pdf" || { rm -f "$output_pdf"; fail "Couldn't compress $name"; }

          original_size=$(wc -c < "$input_pdf")
          compressed_size=$(wc -c < "$output_pdf")
          if [ "$compressed_size" -ge "$original_size" ]; then
              rm -f "$output_pdf"
              continue
          fi
          compressed=$((compressed + 1))
          original_readable=$(readable_size "$original_size")
          compressed_readable=$(readable_size "$compressed_size")
          output_result="$name: $original_readable → $compressed_readable"
      done

      [ "$compressed" -gt 0 ] || fail "The selected PDFs can't be made smaller"
      [ "$compressed" -eq 1 ] || output_result="Compressed $compressed PDFs"
      show "$output_result"
