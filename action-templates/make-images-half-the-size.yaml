gestos-action-template: 1
id: make-images-half-the-size
name: Make Images Half the Size
description: Saves a copy of each selected image at half its size, next to it
icon: zoom-out-symbolic
apps: [FileManager]
needs:
  - program: convert
    package: ImageMagick
steps:
  - copy: files
  - run: |
      #!/bin/sh
      fail() { printf '%s\n' "$*" >&2; exit 1; }
      show() { printf '%s\n' "$*"; }

      resized=0
      for input_image in "$@"; do
          folder=$(dirname "$input_image")
          name=$(basename "$input_image")
          without_extension="${name%.*}"
          extension="${name##*.}"
          if [ "$name" = "$without_extension" ]; then
              output_image="$folder/$name (small)"
          else
              output_image="$folder/$without_extension (small).$extension"
          fi
          [ -e "$output_image" ] && continue
          convert "$input_image" -resize 50% "$output_image" || fail "Couldn't resize $name"
          resized=$((resized + 1))
      done

      [ "$resized" -gt 0 ] || fail "The selected images have a smaller copy already"
      show "Made $resized smaller copies"
