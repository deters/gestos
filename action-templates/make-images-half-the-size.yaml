gestos-action-template: 1
name: Make Images Half the Size
description: Saves a copy of each selected image at half its size, next to it
icon: zoom-out-symbolic
apps: [FileManager]
needs:
  - program: convert
    package: ImageMagick
steps:
  - copy: files
  - run: |
      fail() { echo "$*" >&2; exit 1; }
      show() { echo "$*"; }
      # /a/report.pdf → /a/report
      without_extension() { printf '%s\n' "$1" | sed 's/\.[^./]*$//'; }
      # /a/report.pdf → pdf
      extension_of() { printf '%s\n' "$1" | sed 's/.*\.//'; }

      made=0
      for f in "$@"; do
          small="$(without_extension "$f") (small).$(extension_of "$f")"
          [ -e "$small" ] && continue
          convert "$f" -resize 50% "$small" || fail "Couldn't resize $(basename "$f")"
          made=$((made + 1))
      done

      [ "$made" -gt 0 ] || fail "The selected images have a smaller copy already"
      show "Made $made smaller copies"
