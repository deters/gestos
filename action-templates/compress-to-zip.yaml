gestos-action-template: 1
id: compress-to-zip
name: Compress to ZIP
description: Puts the selected files in one ZIP archive, next to them
icon: package-x-generic-symbolic
apps: [FileManager]
needs:
  - program: zip
    package: zip
steps:
  - copy: files
  - run: |
      #!/bin/sh
      fail() { printf '%s\n' "$*" >&2; exit 1; }
      show() { printf '%s\n' "$*"; }

      # "$@": the selected files, all in one folder
      folder=$(dirname "$1")
      now=$(date '+%F %H-%M-%S')
      output_zip="Archive $now.zip"

      # zip runs in the folder of the files, so it keeps their names without the folders above.
      cd "$folder" || fail "Couldn't open the folder of the selected files"
      # Each path is swapped for its name, with ./ in front, so a name that starts with - isn't
      # read as an option.
      for input_file in "$@"; do
          name=$(basename "$input_file")
          set -- "$@" "./$name"
          shift
      done

      zip -qr "$output_zip" "$@" || fail "Couldn't make the ZIP file"
      show "Saved $output_zip"
