gestos-action-template: 1
id: compress-to-zip
name: Compress to ZIP
description: Puts the selected files in one ZIP archive, next to them
icon: package-x-generic-symbolic
apps: [FileManager]
needs:
  - program: zip
    package: zip
steps:
  - copy: files
  - run: |
      fail() { echo "$*" >&2; exit 1; }
      show() { echo "$*"; }

      cd "$(dirname "$1")" || fail "Couldn't open the folder of the selected files"
      archive="Archive $(date '+%F %H-%M-%S').zip"
      n=$#
      # With ./ in front, a name that starts with - isn't read as an option.
      for f; do set -- "$@" "./$(basename "$f")"; done
      shift $n

      zip -qr "$archive" "$@" || fail "Couldn't make the ZIP file"
      show "Saved $archive"
