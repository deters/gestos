gestos-action-template: 1
name: Convert Images to JPG
description: Saves a JPG copy of each selected image, next to it
apps: [FileManager]
needs:
  - program: convert
    package: ImageMagick
steps:
  - copy: files
  - run: |
      for f in "$@"; do [ -e "${f%.*}.jpg" ] || convert "$f" "${f%.*}.jpg"; done
