gestos-action-template: 1
id: convert-images-to-jpg
name: Convert Images to JPG
description: Saves a JPG copy of each selected image, next to it
icon: image-x-generic-symbolic
apps: [FileManager]
needs:
  - program: convert
    package: ImageMagick
steps:
  - copy: files
  - run: |
      #!/bin/sh
      fail() { printf '%s\n' "$*" >&2; exit 1; }
      show() { printf '%s\n' "$*"; }

      converted=0
      for input_image in "$@"; do
          folder=$(dirname "$input_image")
          name=$(basename "$input_image")
          without_extension="${name%.*}"
          case $name in *.jpg|*.JPG|*.jpeg|*.JPEG) continue ;; esac

          output_jpg="$folder/$without_extension.jpg"
          [ -e "$output_jpg" ] && continue
          convert "$input_image" "$output_jpg" || fail "Couldn't convert $name"
          converted=$((converted + 1))
      done

      [ "$converted" -gt 0 ] || fail "The selected images are JPGs already"
      show "Converted $converted images"
  - show: 3
