gestos-action-template: 1
id: convert-images-to-jpg
name: Convert Images to JPG
description: Saves a JPG copy of each selected image, next to it
icon: image-x-generic-symbolic
apps: [FileManager]
needs:
  - program: convert
    package: ImageMagick
steps:
  - copy: files
  - run: |
      fail() { echo "$*" >&2; exit 1; }
      show() { echo "$*"; }
      # /a/report.pdf → /a/report
      without_extension() { printf '%s\n' "$1" | sed 's/\.[^./]*$//'; }

      converted=0
      for f in "$@"; do
          case $f in *.jpg|*.JPG|*.jpeg|*.JPEG) continue ;; esac
          jpg="$(without_extension "$f").jpg"
          [ -e "$jpg" ] && continue
          convert "$f" "$jpg" || fail "Couldn't convert $(basename "$f")"
          converted=$((converted + 1))
      done

      [ "$converted" -gt 0 ] || fail "The selected images are JPGs already"
      show "Converted $converted images"
