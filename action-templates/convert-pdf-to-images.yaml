gestos-action-template: 1
id: convert-pdf-to-images
name: Convert PDF to Images
description: Saves each page of the selected PDFs as a PNG image, in a folder next to it
icon: image-x-generic-symbolic
apps: [FileManager]
needs:
  - program: pdftoppm
    package: poppler-utils
steps:
  - copy: files
  - run: |
      #!/bin/sh
      fail() { printf '%s\n' "$*" >&2; exit 1; }
      show() { printf '%s\n' "$*"; }

      for input_pdf in "$@"; do
          name=$(basename "$input_pdf")
          case $name in *.pdf|*.PDF) ;; *) fail "$name isn't a PDF" ;; esac
      done

      for input_pdf in "$@"; do
          folder=$(dirname "$input_pdf")
          name=$(basename "$input_pdf")
          without_extension="${name%.*}"
          output_folder_name="$without_extension (images)"
          output_folder="$folder/$output_folder_name"
          [ -e "$output_folder" ] && fail "$output_folder_name is there already"
          mkdir "$output_folder" || fail "Couldn't make $output_folder_name"
          # pdftoppm adds -1.png, -2.png and so on to this.
          images_start="$output_folder/$without_extension page"
          pdftoppm -png -r 150 "$input_pdf" "$images_start" || fail "Couldn't convert $name"
      done

      if [ $# -eq 1 ]; then
          images=$(ls "$output_folder" | wc -l)
          show "Saved $images images in $output_folder_name"
      else
          show "Converted $# PDFs"
      fi
