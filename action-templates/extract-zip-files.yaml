gestos-action-template: 1
name: Extract ZIP Files
description: Extracts each selected ZIP file into a folder named after it
icon: folder-open-symbolic
apps: [FileManager]
needs:
  - program: unzip
    package: unzip
steps:
  - copy: files
  - run: |
      fail() { echo "$*" >&2; exit 1; }
      show() { echo "$*"; }

      for f in "$@"; do
          case $f in *.zip|*.ZIP) ;; *) fail "$(basename "$f") isn't a ZIP file" ;; esac
      done

      for f in "$@"; do
          unzip -qn "$f" -d "${f%.*}" || fail "Couldn't extract $(basename "$f")"
      done
      show "Extracted $# files"
