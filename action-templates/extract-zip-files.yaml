gestos-action-template: 1
id: extract-zip-files
name: Extract ZIP Files
description: Extracts each selected ZIP file into a folder named after it
icon: folder-open-symbolic
apps: [FileManager]
needs:
  - program: unzip
    package: unzip
steps:
  - copy: files
  - run: |
      #!/bin/sh
      fail() { printf '%s\n' "$*" >&2; exit 1; }
      show() { printf '%s\n' "$*"; }

      for input_zip in "$@"; do
          name=$(basename "$input_zip")
          case $name in *.zip|*.ZIP) ;; *) fail "$name isn't a ZIP file" ;; esac
      done

      for input_zip in "$@"; do
          folder=$(dirname "$input_zip")
          name=$(basename "$input_zip")
          without_extension="${name%.*}"
          output_folder="$folder/$without_extension"
          unzip -qn "$input_zip" -d "$output_folder" || fail "Couldn't extract $name"
      done
      show "Extracted $# files"
