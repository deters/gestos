gestos-action-template: 1
id: convert-to-pdf
name: Convert to PDF
description: Converts the selected documents to PDF, next to them
icon: x-office-document-symbolic
apps: [FileManager]
needs:
  - program: libreoffice
    package: LibreOffice
steps:
  - copy: files
  - run: |
      fail() { echo "$*" >&2; exit 1; }
      show() { echo "$*"; }
      # /a/report.pdf → /a/report
      without_extension() { printf '%s\n' "$1" | sed 's/\.[^./]*$//'; }

      converted=0
      for f in "$@"; do
          case $f in *.pdf|*.PDF) continue ;; esac
          libreoffice --headless --convert-to pdf --outdir "$(dirname "$f")" "$f" >/dev/null
          [ -e "$(without_extension "$f").pdf" ] || fail "Couldn't convert $(basename "$f")"
          converted=$((converted + 1))
      done

      [ "$converted" -gt 0 ] || fail "The selected files are PDFs already"
      show "Converted $converted files"
