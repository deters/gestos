gestos-action-template: 1
name: Search the Web
description: Searches the web for the selected text
needs:
  - program: python3
    package: Python
steps:
  - run: |
      text=$(python3 -c 'import sys, urllib.parse; print(urllib.parse.quote(sys.argv[1]))' "$GESTOS_SELECTION")
      xdg-open "https://duckduckgo.com/?q=$text"
