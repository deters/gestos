gestos-action-template: 1
id: make-a-dated-copy
name: Make a Dated Copy
description: Copies each selected file or folder next to it, with today's date in its name
icon: x-office-calendar-symbolic
apps: [FileManager]
steps:
  - copy: files
  - run: |
      #!/bin/sh
      fail() { printf '%s\n' "$*" >&2; exit 1; }
      show() { printf '%s\n' "$*"; }

      today=$(date '+%F')
      for input_file in "$@"; do
          folder=$(dirname "$input_file")
          name=$(basename "$input_file")
          without_extension="${name%.*}"
          extension="${name##*.}"
          without_tar_extension="${without_extension%.tar}"
          # Empty for a hidden file, whose name starts with a dot.
          before_first_dot="${name%%.*}"

          # The date goes before the extension, which a folder, a hidden file or a name without a
          # dot doesn't have.
          if [ -d "$input_file" ] || [ -z "$before_first_dot" ] || [ "$name" = "$without_extension" ]; then
              before_date="$name"
              after_date=""
          elif [ "$without_tar_extension" != "$without_extension" ]; then
              before_date="$without_tar_extension"
              after_date=".tar.$extension"
          else
              before_date="$without_extension"
              after_date=".$extension"
          fi

          output_file="$folder/$before_date $today$after_date"
          if [ -e "$output_file" ]; then
              now=$(date '+%H-%M-%S')
              output_file="$folder/$before_date $today $now$after_date"
          fi
          output_name=$(basename "$output_file")
          [ -e "$output_file" ] && fail "$output_name is there already"
          cp -Rp "$input_file" "$output_file" || fail "Couldn't copy $name"
      done

      if [ $# -eq 1 ]; then
          show "Saved $output_name"
      else
          show "Made $# dated copies"
      fi
  - show: 3
