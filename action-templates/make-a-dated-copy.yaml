gestos-action-template: 1
name: Make a Dated Copy
description: Copies each selected file or folder next to it, with today's date in its name
icon: x-office-calendar-symbolic
apps: [FileManager]
steps:
  - copy: files
  - run: |
      fail() { echo "$*" >&2; exit 1; }
      show() { echo "$*"; }
      # /a/report.pdf → /a/report
      without_extension() { printf '%s\n' "$1" | sed 's/\.[^./]*$//'; }
      # /a/report.pdf → pdf
      extension_of() { printf '%s\n' "$1" | sed 's/.*\.//'; }

      today=$(date '+%F')
      for f in "$@"; do
          dir=$(dirname "$f")
          name=$(basename "$f")
          # The date goes before the extension, which a folder or a hidden file doesn't have.
          case $name in
              .*) base="$name"; ext="" ;;
              *.tar.*) base=$(without_extension "$(without_extension "$name")"); ext=".tar.$(extension_of "$name")" ;;
              *.*) [ -d "$f" ] && { base="$name"; ext=""; } || { base=$(without_extension "$name"); ext=".$(extension_of "$name")"; } ;;
              *) base="$name"; ext="" ;;
          esac
          copy="$dir/$base $today$ext"
          [ -e "$copy" ] && copy="$dir/$base $today $(date '+%H-%M-%S')$ext"
          [ -e "$copy" ] && fail "$(basename "$copy") is there already"
          cp -Rp "$f" "$copy" || fail "Couldn't copy $(basename "$f")"
      done

      [ $# -eq 1 ] && show "Saved $(basename "$copy")" || show "Made $# dated copies"
