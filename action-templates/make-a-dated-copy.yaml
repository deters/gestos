gestos-action-template: 1
name: Make a Dated Copy
description: Copies each selected file or folder next to it, with today's date in its name
icon: x-office-calendar-symbolic
apps: [FileManager]
steps:
  - copy: files
  - run: |
      fail() { echo "$*" >&2; exit 1; }
      show() { echo "$*"; }

      today=$(date '+%F')
      for f in "$@"; do
          dir=$(dirname "$f")
          name="${f##*/}"
          # The date goes before the extension, which a folder or a hidden file doesn't have.
          case $name in
              .*) base="$name"; ext="" ;;
              *.tar.*) base="${name%.tar.*}"; ext=".tar.${name##*.tar.}" ;;
              *.*) [ -d "$f" ] && { base="$name"; ext=""; } || { base="${name%.*}"; ext=".${name##*.}"; } ;;
              *) base="$name"; ext="" ;;
          esac
          copy="$dir/$base $today$ext"
          [ -e "$copy" ] && copy="$dir/$base $today $(date '+%H-%M-%S')$ext"
          [ -e "$copy" ] && fail "${copy##*/} is there already"
          cp -Rp "$f" "$copy" || fail "Couldn't copy ${f##*/}"
      done

      [ $# -eq 1 ] && show "Saved ${copy##*/}" || show "Made $# dated copies"
