gestos-action-template: 1
name: Read Aloud
description: Reads the selected text aloud
needs:
  - program: spd-say
    package: speech-dispatcher
steps:
  - run: |
      fail() { echo "$*" >&2; exit 1; }
      show() { echo "$*"; }

      [ -n "$GESTOS_SELECTION" ] || fail "Select some text first"

      spd-say "$GESTOS_SELECTION"
