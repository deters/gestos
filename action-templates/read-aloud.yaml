gestos-action-template: 1
id: read-aloud
name: Read Aloud
description: Reads the selected text aloud
icon: audio-speakers-symbolic
needs:
  - program: spd-say
    package: speech-dispatcher
steps:
  - copy: text
  - run: |
      #!/bin/sh
      fail() { printf '%s\n' "$*" >&2; exit 1; }
      show() { printf '%s\n' "$*"; }

      input_text="$GESTOS_CLIPBOARD"
      [ -n "$input_text" ] || fail "Select some text first"

      spd-say "$input_text"
