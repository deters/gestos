gestos-action-template: 1
name: Read Aloud
description: Reads the selected text aloud
icon: audio-speakers-symbolic
needs:
  - program: spd-say
    package: speech-dispatcher
steps:
  - copy: text
  - run: |
      fail() { echo "$*" >&2; exit 1; }
      show() { echo "$*"; }

      [ -n "$GESTOS_CLIPBOARD" ] || fail "Select some text first"

      spd-say "$GESTOS_CLIPBOARD"
