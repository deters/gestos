gestos-action-template: 1
id: open-link
name: Open Link
description: Opens the selected text as a link
icon: insert-link-symbolic
needs:
  - program: xdg-open
    package: xdg-utils
steps:
  - copy: text
  - run: |
      #!/bin/sh
      fail() { printf '%s\n' "$*" >&2; exit 1; }
      show() { printf '%s\n' "$*"; }

      input_text="$GESTOS_CLIPBOARD"
      [ -n "$input_text" ] || fail "Select some text first"

      case "$input_text" in
          http://*|https://*) output_link="$input_text" ;;
          www.*) output_link="https://$input_text" ;;
          *) fail "The selected text isn't a link" ;;
      esac
      xdg-open "$output_link"
