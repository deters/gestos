gestos-action-template: 1
name: Open Link
description: Opens the selected text as a link
needs:
  - program: xdg-open
    package: xdg-utils
steps:
  - run: |
      fail() { echo "$*" >&2; exit 1; }
      show() { echo "$*"; }

      [ -n "$GESTOS_SELECTION" ] || fail "Select some text first"

      case "$GESTOS_SELECTION" in
          http://*|https://*) xdg-open "$GESTOS_SELECTION" ;;
          www.*) xdg-open "https://$GESTOS_SELECTION" ;;
          *) fail "The selected text isn't a link" ;;
      esac
