gestos-action-template: 1
name: Open Link
description: Opens the selected text as a link
icon: insert-link-symbolic
needs:
  - program: xdg-open
    package: xdg-utils
steps:
  - copy: text
  - run: |
      fail() { echo "$*" >&2; exit 1; }
      show() { echo "$*"; }

      [ -n "$GESTOS_CLIPBOARD" ] || fail "Select some text first"

      case "$GESTOS_CLIPBOARD" in
          http://*|https://*) xdg-open "$GESTOS_CLIPBOARD" ;;
          www.*) xdg-open "https://$GESTOS_CLIPBOARD" ;;
          *) fail "The selected text isn't a link" ;;
      esac
