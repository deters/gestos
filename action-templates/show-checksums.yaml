gestos-action-template: 1
name: Show Checksums
description: Shows the SHA-256 checksum of each selected file
apps: [FileManager]
needs:
  - program: notify-send
    package: libnotify
steps:
  - copy: files
  - run: |
      notify-send "SHA-256" "$(for f in "$@"; do printf '%s  %s\n' "$(sha256sum < "$f" | cut -d' ' -f1)" "${f##*/}"; done)"
