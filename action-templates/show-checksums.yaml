gestos-action-template: 1
id: show-checksums
name: Show Checksums
description: Shows the SHA-256 checksum of each selected file
icon: security-high-symbolic
apps: [FileManager]
steps:
  - copy: files
  - run: |
      #!/bin/sh
      fail() { printf '%s\n' "$*" >&2; exit 1; }
      show() { printf '%s\n' "$*"; }

      for input_file in "$@"; do
          name=$(basename "$input_file")
          [ -f "$input_file" ] || fail "$name is a folder, and only files have a checksum"
      done

      for input_file in "$@"; do
          name=$(basename "$input_file")
          # The checksum, then a - for what it read.
          checksum_line=$(sha256sum < "$input_file") || fail "Couldn't read $name"
          checksum=$(printf '%s\n' "$checksum_line" | cut -d ' ' -f 1)
          show "$checksum  $name"
      done
