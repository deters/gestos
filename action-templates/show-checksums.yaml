gestos-action-template: 1
name: Show Checksums
description: Shows the SHA-256 checksum of each selected file
icon: security-high-symbolic
apps: [FileManager]
steps:
  - copy: files
  - run: |
      fail() { echo "$*" >&2; exit 1; }
      show() { echo "$*"; }

      for f in "$@"; do
          [ -f "$f" ] || fail "${f##*/} is a folder, and only files have a checksum"
      done

      for f in "$@"; do
          sum=$(sha256sum "$f") || fail "Couldn't read ${f##*/}"
          show "${sum%% *}  ${f##*/}"
      done
