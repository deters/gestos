gestos-action-template: 1
id: convert-images-to-png
name: Convert Images to PNG
description: Saves a PNG copy of each selected image, next to it
icon: image-x-generic-symbolic
apps: [FileManager]
needs:
  - program: convert
    package: ImageMagick
steps:
  - copy: files
  - run: |
      #!/bin/sh
      fail() { printf '%s\n' "$*" >&2; exit 1; }
      show() { printf '%s\n' "$*"; }

      converted=0
      for input_image in "$@"; do
          folder=$(dirname "$input_image")
          name=$(basename "$input_image")
          without_extension="${name%.*}"
          case $name in *.png|*.PNG) continue ;; esac

          output_png="$folder/$without_extension.png"
          [ -e "$output_png" ] && continue
          convert "$input_image" "$output_png" || fail "Couldn't convert $name"
          converted=$((converted + 1))
      done

      [ "$converted" -gt 0 ] || fail "The selected images are PNGs already"
      show "Converted $converted images"
  - show: 3
