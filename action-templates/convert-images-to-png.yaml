gestos-action-template: 1
name: Convert Images to PNG
description: Saves a PNG copy of each selected image, next to it
icon: image-x-generic-symbolic
apps: [FileManager]
needs:
  - program: convert
    package: ImageMagick
steps:
  - copy: files
  - run: |
      fail() { echo "$*" >&2; exit 1; }
      show() { echo "$*"; }
      # /a/report.pdf → /a/report
      without_extension() { printf '%s\n' "$1" | sed 's/\.[^./]*$//'; }

      converted=0
      for f in "$@"; do
          case $f in *.png|*.PNG) continue ;; esac
          png="$(without_extension "$f").png"
          [ -e "$png" ] && continue
          convert "$f" "$png" || fail "Couldn't convert $(basename "$f")"
          converted=$((converted + 1))
      done

      [ "$converted" -gt 0 ] || fail "The selected images are PNGs already"
      show "Converted $converted images"
