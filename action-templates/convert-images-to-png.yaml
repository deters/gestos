gestos-action-template: 1
name: Convert Images to PNG
description: Saves a PNG copy of each selected image, next to it
apps: [FileManager]
needs:
  - program: convert
    package: ImageMagick
steps:
  - copy: files
  - run: |
      for f in "$@"; do [ -e "${f%.*}.png" ] || convert "$f" "${f%.*}.png"; done
