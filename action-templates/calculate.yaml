gestos-action-template: 1
id: calculate
name: Calculate
description: Shows the result of the selected calculation
icon: accessories-calculator-symbolic
needs:
  - program: bc
    package: bc
steps:
  - copy: text
  - run: |
      #!/bin/sh
      fail() { printf '%s\n' "$*" >&2; exit 1; }
      show() { printf '%s\n' "$*"; }

      input_text="$GESTOS_CLIPBOARD"
      [ -n "$input_text" ] || fail "Select some text first"

      # What's left once digits, operators, brackets and spaces are taken out.
      others=$(printf '%s\n' "$input_text" | tr -d '0-9.+*/%^() \n-')
      [ -z "$others" ] || fail "The selected text isn't a calculation"

      output_result=$(printf '%s\n' "$input_text" | bc -l 2>/dev/null)
      [ -n "$output_result" ] || fail "The selected text isn't a calculation"
      show "$input_text = $output_result"
  - show: 5
