gestos-action-template: 1
name: Calculate
description: Shows the result of the selected calculation
needs:
  - program: bc
    package: bc
steps:
  - run: |
      fail() { echo "$*" >&2; exit 1; }
      show() { echo "$*"; }

      [ -n "$GESTOS_SELECTION" ] || fail "Select some text first"
      others=$(echo "$GESTOS_SELECTION" | tr -d '0-9.+*/%^() \n-')
      [ -z "$others" ] || fail "The selected text isn't a calculation"

      result=$(echo "$GESTOS_SELECTION" | bc -l 2>/dev/null)
      [ -n "$result" ] || fail "The selected text isn't a calculation"
      show "$GESTOS_SELECTION = $result"
