gestos-action-template: 1
name: Merge PDFs
description: Puts the selected PDFs together in one, next to them
icon: view-continuous-symbolic
apps: [FileManager]
needs:
  - program: pdfunite
    package: poppler-utils
steps:
  - copy: files
  - run: |
      fail() { echo "$*" >&2; exit 1; }
      show() { echo "$*"; }

      [ $# -ge 2 ] || fail "Select at least two PDFs to merge"
      for f in "$@"; do
          case $f in *.pdf|*.PDF) ;; *) fail "${f##*/} isn't a PDF" ;; esac
      done

      merged="$(dirname "$1")/Merged $(date '+%F %H-%M-%S').pdf"
      pdfunite "$@" "$merged" || fail "Couldn't merge the PDFs"
      show "Saved ${merged##*/}"
