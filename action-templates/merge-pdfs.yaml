gestos-action-template: 1
id: merge-pdfs
name: Merge PDFs
description: Puts the selected PDFs together in one, next to them
icon: view-continuous-symbolic
apps: [FileManager]
needs:
  - program: pdfunite
    package: poppler-utils
steps:
  - copy: files
  - run: |
      #!/bin/sh
      fail() { printf '%s\n' "$*" >&2; exit 1; }
      show() { printf '%s\n' "$*"; }

      # "$@": the selected PDFs, merged in this order
      [ $# -ge 2 ] || fail "Select at least two PDFs to merge"
      for input_pdf in "$@"; do
          name=$(basename "$input_pdf")
          case $name in *.pdf|*.PDF) ;; *) fail "$name isn't a PDF" ;; esac
      done

      folder=$(dirname "$1")
      now=$(date '+%F %H-%M-%S')
      output_name="Merged $now.pdf"
      output_pdf="$folder/$output_name"
      pdfunite "$@" "$output_pdf" || fail "Couldn't merge the PDFs"
      show "Saved $output_name"
