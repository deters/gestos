gestos-action-template: 1
id: copy-text-from-screen
name: Copy Text from Screen
description: Copies the text in an area of the screen you select, even in images and videos
icon: applets-screenshooter-symbolic
needs:
  - program: tesseract
    package: Tesseract OCR
steps:
  - run: |
      #!/bin/sh
      fail() { printf '%s\n' "$*" >&2; exit 1; }
      show() { printf '%s\n' "$*"; }
      has() { command -v "$1" >/dev/null; }

      runtime_folder="${XDG_RUNTIME_DIR:-/tmp}"
      desktop="${XDG_CURRENT_DESKTOP:-}"
      wayland_display="${WAYLAND_DISPLAY:-}"
      input_screenshot="$runtime_folder/gestos-screen-text.png"
      rm -f "$input_screenshot"

      # Each desktop has its own way to select an area.
      case "$desktop" in
          *KDE*) has spectacle || fail "Install Spectacle"
                 spectacle --region --background --nonotify --output "$input_screenshot" ;;
          *GNOME*) has gnome-screenshot || fail "Install gnome-screenshot"
                   gnome-screenshot --area --file="$input_screenshot" ;;
          *) if [ -n "$wayland_display" ]; then
                 has grim && has slurp || fail "Install grim and slurp"
                 area=$(slurp) && grim -g "$area" "$input_screenshot"
             else
                 has import || fail "Install ImageMagick"
                 import "$input_screenshot"
             fi ;;
      esac
      # Without a screenshot, no area was selected.
      [ -s "$input_screenshot" ] || exit 0

      # The languages installed for it, which are the ones the user wants.
      languages=$(tesseract --list-langs 2>/dev/null | tail -n +2 | grep -vx osd | paste -sd+)
      if [ -n "$languages" ]; then
          output_text=$(tesseract "$input_screenshot" - -l "$languages" 2>/dev/null)
      else
          output_text=$(tesseract "$input_screenshot" - 2>/dev/null)
      fi
      rm -f "$input_screenshot"
      letters=$(printf %s "$output_text" | tr -d '[:space:]')
      [ -n "$letters" ] || fail "There's no text in the selected area"

      # They stay to hand the text over, and mustn't keep what Gestos reads from this open.
      if [ -n "$wayland_display" ]; then
          has wl-copy || fail "Install wl-clipboard to copy the text"
          printf %s "$output_text" | wl-copy >/dev/null 2>&1
      else
          has xclip || fail "Install xclip to copy the text"
          printf %s "$output_text" | xclip -selection clipboard >/dev/null 2>&1
      fi
      show "$output_text"
