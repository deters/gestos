gestos-action-template: 1
id: count-words
name: Count Words
description: Shows how many words the selected text has
icon: format-text-plaintext-symbolic
steps:
  - copy: text
  - run: |
      #!/bin/sh
      fail() { printf '%s\n' "$*" >&2; exit 1; }
      show() { printf '%s\n' "$*"; }

      input_text="$GESTOS_CLIPBOARD"
      [ -n "$input_text" ] || fail "Select some text first"

      words=$(printf '%s\n' "$input_text" | wc -w)
      if [ "$words" -eq 1 ]; then
          output_result="1 word"
      else
          output_result="$words words"
      fi
      show "$output_result"
