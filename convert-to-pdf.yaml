gestos-action-template: 1
id: convert-to-pdf
name: Convert to PDF
description: Converts the selected documents to PDF, next to them
icon: x-office-document-symbolic
apps: [FileManager]
needs:
  - program: libreoffice
    package: LibreOffice
steps:
  - copy: files
  - run: |
      #!/bin/sh
      fail() { printf '%s\n' "$*" >&2; exit 1; }
      show() { printf '%s\n' "$*"; }

      converted=0
      for input_document in "$@"; do
          folder=$(dirname "$input_document")
          name=$(basename "$input_document")
          without_extension="${name%.*}"
          case $name in *.pdf|*.PDF) continue ;; esac

          output_pdf="$folder/$without_extension.pdf"
          libreoffice --headless --convert-to pdf --outdir "$folder" "$input_document" >/dev/null
          [ -e "$output_pdf" ] || fail "Couldn't convert $name"
          converted=$((converted + 1))
      done

      [ "$converted" -gt 0 ] || fail "The selected files are PDFs already"
      show "Converted $converted files"
  - show: 3
