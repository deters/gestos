[package]
name = "gestos"
version = "8.1.1"
edition = "2021"
authors = ["Lucas Augusto Deters <lucasdeters@gmail.com>"]
license = "GPL-2.0-or-later"

[lib]
name = "gestos"
path = "src/lib.rs"

[[bin]]
name = "gestosd"
path = "src/bin/gestosd.rs"

[[bin]]
name = "gestos-input"
path = "src/bin/gestos-input.rs"

[[bin]]
name = "gestos"
path = "src/bin/gestos/main.rs"

[dependencies]
gtk4 = { version = "0.9", features = ["v4_6"] }
# Only what libadwaita 1.2 offers, the version Debian 12 has.
adw = { version = "0.7", package = "libadwaita", features = ["v1_2"] }
gio = "0.20"
x11rb = { version = "0.13", features = ["shape", "randr"] }
# What the panel saying what a gesture did is drawn with, where Gestos draws it itself.
cairo-rs = "0.20"
pangocairo = "0.20"
# KDE's Wayland, where the gesture path is a layer over the screen.
smithay-client-toolkit = { version = "0.21", default-features = false }
serde = { version = "1.0", features = ["derive"] }
serde_yaml = "0.9"
serde_json = "1"
nix = { version = "0.27", features = ["mman", "signal", "fs", "user", "ioctl", "poll"] }
libc = "0.2"
regex = "1"
once_cell = "1.18"
log = "0.4"
env_logger = "0.10"
zbus = { version = "4.0", features = ["blocking"] }
futures-util = "0.3"
futures-channel = "0.3"
unicode-normalization = "0.1"

[target.'cfg(target_os = "linux")'.dependencies]
evdev = "0.13"
xkbcommon-dl = "0.4"
